name: Ticket Auto Responder

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-respond:
    runs-on: ubuntu-latest
    steps:
      - name: Create comment with buttons
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🤖 Automated Response
            Hello @${{ github.event.issue.user.login }}, 

            Thank you for opening a ticket! Our team has been notified. While you wait for a team member to review your request, please check out the quick links below:

            ---

            <a href="https://your-website.com/docs"><img src="https://img.shields.io/badge/📚_Read_Documentation-blue?style=for-the-badge" alt="Read Docs"></a> &nbsp; <a href="https://your-website.com/status"><img src="https://img.shields.io/badge/🟢_Check_System_Status-green?style=for-the-badge" alt="Check Status"></a> &nbsp; <a href="https://github.com/${{ github.repository }}/discussions"><img src="https://img.shields.io/badge/💬_Ask_Community-orange?style=for-the-badge" alt="Ask Community"></a>

            ---

            _- Supremo_
